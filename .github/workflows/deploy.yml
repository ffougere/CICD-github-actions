name: CI-CD Python App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    #runs-on: [self-hosted, linux, x64, python-app]
    runs-on: thermaltake
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  deploy:
    name: Deploy application
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, python-app]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy on self-hosted Linux runner
        env:
          APP_DIR: /opt/simple-python-app
          SERVICE_NAME: simple-python-app
          APP_PORT: "8000"
        run: |
          bash scripts/deploy.sh
